name: Public source tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests/python -v
      - run: python tools/check_restricted_files.py
      - run: python tools/check_restricted_files.py --history HEAD
      - run: git diff --check
