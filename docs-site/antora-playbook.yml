site:
  title: GDCubism upstream archive
  url: https://mizunagikb.github.io/gd_cubism/
  start_page: gd_cubism::en/index.adoc
content:
  sources:
    - url: https://github.com/MizunagiKB/gd_cubism.git
      branches: [0.6, 0.7, 0.8, 0.9]
      start_path: docs-src
ui:
  bundle:
    url: https://github.com/MizunagiKB/gd_cubism_ui/releases/download/v1.0.0/ui-bundle.zip
output:
  # Resolve from this playbook; never generate over the maintained port guides.
  dir: ./../.local-build/upstream-docs
antora:
  extensions:
    - require: "@antora/lunr-extension"
      languages: [en]
